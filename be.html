<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách bể — HPZ Aquaroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
.tank-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.tank-card{overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}.tank-photo{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#103b5a,#082238);border-bottom:1px solid var(--border);color:var(--muted);font-weight:600}.tank-body{padding:22px}.tank-name{font-size:1.35rem;font-weight:800;margin-bottom:14px}.tank-info{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:0 0 20px}.tank-info div{border-bottom:1px solid var(--border);padding:8px 0;color:var(--muted)}.tank-info b{display:block;color:var(--cyan);font-size:.8rem;text-transform:uppercase;letter-spacing:.5px}.tank-empty{color:var(--muted);font-style:italic}@media(max-width:760px){.tank-grid{grid-template-columns:1fr}.tank-info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="aquarium-bg"></div>
<header class="site"><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/img/logo.png" alt="HPZ Aquaroom logo"><span class="name">HPZ AQUAROOM<small>SHOWROOM CÁ CẢNH</small></span></a><ul><li><a href="index.html">Trang chủ</a></li><li><a href="beca.html">Danh sách cá</a></li><li><a href="be.html" class="active">Danh sách bể</a></li><li><a href="chinhsach.html">Chính sách</a></li><li><a href="index.html#contact" class="cta">Liên hệ</a></li></ul></div></header>
<main class="wrap"><section class="block"><h1 class="section-title">Danh sách bể</h1><p class="section-sub">Các mẫu bể có sẵn tại HPZ Aquaroom. Nhắn shop để được tư vấn và báo giá chi tiết.</p><div class="tank-grid" id="tank-grid"></div></section></main>
<footer class="site"><div class="wrap">HPZ Aquaroom · Cầu Giấy, Hà Nội · <a href="https://www.facebook.com/hpzaquaroom" target="_blank" rel="noopener">Facebook</a><br>© 2026 HPZ Aquaroom.</div></footer>
<script src="assets/js/scene.js?v=6"></script>
<script>
const TANKS=[{name:'Tên mẫu bể',size:'',glass:'',included:'',price:'',image:''},{name:'Tên mẫu bể',size:'',glass:'',included:'',price:'',image:''},{name:'Tên mẫu bể',size:'',glass:'',included:'',price:'',image:''},{name:'Tên mẫu bể',size:'',glass:'',included:'',price:'',image:''}];
const blank=v=>v||'<span class="tank-empty">Chưa cập nhật</span>';
document.getElementById('tank-grid').innerHTML=TANKS.map(t=>`<article class="tank-card"><div class="tank-photo">${t.image?`<img src="${t.image}" alt="${t.name}" style="width:100%;height:100%;object-fit:cover">`:'Khu vực ảnh bể'}</div><div class="tank-body"><h2 class="tank-name">${t.name}</h2><div class="tank-info"><div><b>Kích thước</b>${blank(t.size)}</div><div><b>Kính</b>${blank(t.glass)}</div><div><b>Thiết bị đi kèm</b>${blank(t.included)}</div><div><b>Giá</b>${blank(t.price)}</div></div><a class="btn" href="https://www.facebook.com/hpzaquaroom" target="_blank" rel="noopener">Nhắn shop tư vấn →</a></div></article>`).join('');
</script>
</body>
</html>
